
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmos - MTE, RUET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap');
      body {
        font-family: 'Ubuntu', sans-serif;
        background-color: #000;
      }
      /* Custom scrollbar for a better aesthetic */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #dc2626;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ef4444;
      }
      /* Custom styling for the range slider thumb */
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 24px;
        width: 24px;
        border-radius: 50%;
        background: #ef4444;
        cursor: pointer;
        margin-top: -8px; /* You need to specify a margin in Chrome, but not in Firefox */
        box-shadow: 0 0 5px rgba(239, 68, 68, 0.7);
      }
      input[type=range]::-moz-range-thumb {
        height: 24px;
        width: 24px;
        border-radius: 50%;
        background: #ef4444;
        cursor: pointer;
        border: none;
        box-shadow: 0 0 5px rgba(239, 68, 68, 0.7);
      }
    </style>
